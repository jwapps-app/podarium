# Local development database only. The application runs in a uv venv on the host.
# The production stack lives in deploy/portainer-stack.yml and is never run from here.
services:
  postgres:
    image: postgres:18-alpine
    container_name: podarium-dev-db
    environment:
      POSTGRES_USER: podarium
      POSTGRES_PASSWORD: podarium
      POSTGRES_DB: podarium
      PGDATA: /var/lib/pgdata/pgdata
    volumes:
      - podarium_dev_pgdata:/var/lib/pgdata
    ports:
      - "5455:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U podarium"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  podarium_dev_pgdata:
