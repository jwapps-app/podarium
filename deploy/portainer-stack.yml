# Podarium — Portainer stack for docker-audio (192.168.1.30)
#
# Paste into the Portainer web editor. There is deliberately no compose file on the host.
#
# ---------------------------------------------------------------------------------------
# BEFORE DEPLOYING
# ---------------------------------------------------------------------------------------
#
#  1. Confirm the port is free:
#         ss -tlnp | grep 8044
#     8040 is PinePods. If 8044 is taken, change the published port AND PUBLIC_URL below.
#
#  2. Create the data directories and give them to the uid the container runs as:
#         sudo mkdir -p /home/jworthington/docker/podarium/{pgdata,downloads,artwork}
#         sudo chown -R 1026:100 /home/jworthington/docker/podarium/{downloads,artwork}
#     pgdata is left alone -- the Postgres image manages its own ownership.
#
#  3. Set the variables in Portainer's "Environment variables" panel, below the editor.
#     Nothing secret goes in this file, so it stays committable as-is, and DB_PASSWORD is
#     written once rather than kept in sync in two places by hand.
#
#         DB_PASSWORD          openssl rand -hex 32
#         SECRET_KEY           openssl rand -hex 32
#         LOGIN_USERNAME       the account to create on first boot
#         LOGIN_PASSWORD       what you will type to sign in
#         PODCASTINDEX_KEY     from your local .env -- optional
#         PODCASTINDEX_SECRET  from your local .env -- optional
#         PUBLIC_URL           optional; defaults to http://192.168.1.30:8044
#                              set to https://<hostname> once Cloudflare fronts it
#         VAPID_*              optional; notifications stay off without them. See
#                              NOTIFICATIONS at the bottom.
#         BACKUP_KEEP          optional; nightly dumps to retain, default 14
#         METRICS_TOKEN        optional; when set, /metrics requires it as a bearer token.
#                              Worth setting (or blocking /metrics in Cloudflare) now that
#                              the app is reachable from the internet.
#
#     The four with :? are required and fail the deploy loudly if unset. Leaving the
#     Podcast Index pair out is fine: search returns a clean 503 and the UI says so, while
#     subscribing by feed URL, refresh, downloads, retention and playback all still work.
#
#  4. Portainer already has a `ghcr` registry with authentication enabled. This is the
#     first *private* package it will pull, so if that stored token has expired this is
#     where it surfaces -- as an auth error on pull, not a stack error.
#
# ---------------------------------------------------------------------------------------
# STORAGE
# ---------------------------------------------------------------------------------------
#
# Audio lives on local NVMe, not the NAS. Measured against real downloads the working set
# is about 1.2 GB for four shows at three episodes each, roughly 6 GB at fifteen shows, and
# retention plus the auto-download window keep it converging rather than growing.
#
# The reason the spec put audio on the NAS still stands, though, and it is about backups
# rather than disks: this is churning, incompressible, re-downloadable data that should not
# enter vzdump or reach PBS. Exclude
#     /home/jworthington/docker/podarium/downloads
# from the backup job once you have watched it for a while.
#
# Moving to the NAS later is a four-step job and needs no database change, because
# local_path stores the *container* path and that never moves: stop the stack, rsync the
# files across, swap the one bind mount marked below, start it again.

services:
  postgres:
    image: postgres:18-alpine
    container_name: podarium-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: podarium
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in the environment variables panel}
      POSTGRES_DB: podarium
      # Postgres 18 mounts at /var/lib/pgdata with PGDATA one level deeper. The older
      # /var/lib/postgresql/data path fails on overlay2 hosts -- this bit the PinePods stack.
      PGDATA: /var/lib/pgdata/pgdata
    volumes:
      # Small, valuable, and the one thing here worth backing up.
      - /home/jworthington/docker/podarium/pgdata:/var/lib/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U podarium"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Nightly logical backup. vzdump already sweeps the pgdata directory, but a filesystem
  # snapshot of a running Postgres is crash-consistent rather than consistent -- it is what
  # you would have if the power went out mid-write, and Postgres usually replays its WAL
  # from that but not always. pg_dump reads inside a transaction and cannot have the
  # problem, so the backup ends up holding both the raw directory and a known-good dump.
  #
  # Written into the same tree vzdump already picks up, so there is nothing to configure on
  # the Proxmox side. The script is inline rather than mounted from the host: this stack is
  # pasted into Portainer, and a file that has to be placed on the host first is a step that
  # can be forgotten or -- since this repository is private -- quietly 404.
  #
  # $$ escapes a literal $ so Compose leaves it for the shell instead of interpolating it.
  backup:
    image: postgres:18-alpine
    container_name: podarium-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://podarium:${DB_PASSWORD:?set DB_PASSWORD in the environment variables panel}@postgres:5432/podarium
      # How many nightly dumps to keep.
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - /home/jworthington/docker/podarium/backups:/backups
    # No cron in this image and no reason to add one: dump, sleep, repeat. A restart runs a
    # dump immediately, which is what you want after touching the stack anyway.
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          TS=$$(date +%Y%m%d-%H%M%S)
          OUT="/backups/podarium-$$TS.sql.gz"
          # Dumped to a file first rather than piped straight into gzip: this shell has no
          # pipefail, so a failing pg_dump in a pipeline still reports gzip's success and
          # would leave a valid archive of a truncated dump.
          if pg_dump --no-owner --no-privileges "$$DATABASE_URL" > /tmp/podarium.sql; then
            # .partial until it is complete, so a container killed mid-write cannot leave
            # something that looks like a finished backup.
            gzip -c /tmp/podarium.sql > "$$OUT.partial" && mv "$$OUT.partial" "$$OUT"
            echo "backup: wrote $$(basename $$OUT) ($$(du -h $$OUT | cut -f1))"
          else
            echo "backup: pg_dump failed" >&2
            rm -f "$$OUT.partial"
          fi
          rm -f /tmp/podarium.sql
          # Keep the newest N. A read loop rather than xargs -r, which busybox does not
          # reliably have.
          ls -1t /backups/podarium-*.sql.gz 2>/dev/null | tail -n +$$((BACKUP_KEEP + 1)) |
            while read -r old; do rm -f "$$old"; done
          sleep 86400
        done

  api:
    # Multi-architecture: the same tag resolves to amd64 or arm64 by host, so this line
    # does not change if the stack ever moves. Published by .github/workflows/build.yml.
    image: ghcr.io/jwapps-app/podarium-api:latest
    container_name: podarium-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Kept at the NFS share's ownership even while the data is local, so moving to the NAS
    # later is a bind-mount change and nothing else.
    user: "1026:100"
    environment:
      # Same variable as POSTGRES_PASSWORD above, so the two cannot drift apart -- a
      # mismatch shows up as the API restarting in a loop while Postgres looks healthy.
      DATABASE_URL: postgresql+asyncpg://podarium:${DB_PASSWORD}@postgres:5432/podarium

      # How the browser reaches this. Leave the variable unset for the LAN address; set it
      # to the Cloudflare hostname once that fronts it.
      #
      # Its only job is deciding whether the session cookie is marked Secure. The two
      # directions are not symmetric: an http value reached over https merely leaves the
      # cookie unflagged, which browsers accept, but an https value reached over plain http
      # makes the browser drop the cookie entirely -- a login screen that never goes away,
      # with nothing in any log. So if you use both routes, leave this on the LAN default.
      PUBLIC_URL: ${PUBLIC_URL:-http://192.168.1.30:8044}

      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in the environment variables panel}

      DOWNLOAD_DIR: /downloads
      ARTWORK_DIR: /artwork

      # Applied only on first boot, while the users table is empty. Leaving them here
      # afterwards is harmless; they are ignored once the account exists, so a restart
      # cannot reset your password.
      PODARIUM_USERNAME: ${LOGIN_USERNAME:?set LOGIN_USERNAME in the environment variables panel}
      PODARIUM_PASSWORD: ${LOGIN_PASSWORD:?set LOGIN_PASSWORD in the environment variables panel}

      # Free from podcastindex.org; copy from your local .env. Discovery only. Without
      # them /api/search returns a clean 503 and the UI says so; subscribing by feed URL,
      # refresh, downloads, retention and playback all work regardless.
      # Default to empty rather than required: absent is a supported state.
      PODCASTINDEX_KEY: ${PODCASTINDEX_KEY:-}
      PODCASTINDEX_SECRET: ${PODCASTINDEX_SECRET:-}

      # Web Push. Optional -- leave these unset and notifications are simply off, with the
      # settings panel saying so. Generate a pair with:
      #     docker exec podarium-api python -m podarium.vapid
      # The private key prints base64-encoded precisely so it survives this panel in one
      # line; a multi-line PEM is the shape that arrives truncated.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_CONTACT: ${VAPID_CONTACT:-mailto:admin@localhost}

      # Optional. Set it and /metrics requires "Authorization: Bearer <token>"; unset, the
      # endpoint stays open, which is fine on a LAN and not fine through Cloudflare.
      METRICS_TOKEN: ${METRICS_TOKEN:-}

      # Two concurrent downloads. Raise it and a refresh that queues several long episodes
      # will saturate the link.
      DOWNLOAD_CONCURRENCY: "2"

      # How often retention sweeps. Auto-download trimming runs on each feed refresh.
      RETENTION_SWEEP_MINUTES: "60"
    volumes:
      # --- audio and artwork: local NVMe -------------------------------------------------
      - /home/jworthington/docker/podarium/downloads:/downloads
      - /home/jworthington/docker/podarium/artwork:/artwork
      #
      # --- to move audio to the NAS later, comment the two lines above and use these -----
      # - /mnt/nas/podarium/downloads:/downloads
      # - /mnt/nas/podarium/artwork:/artwork
      #
      # The NAS route needs the fstab mount from 192.168.1.42 with
      #     noauto,x-systemd.automount,soft,timeo=100
      # Do NOT add RequiresMountsFor= to the docker.service drop-in: combined with noauto
      # it blocks Docker from ever starting.
    ports:
      - "8044:8044"

# ---------------------------------------------------------------------------------------
# AFTER DEPLOYING
# ---------------------------------------------------------------------------------------
#
#  - Open http://192.168.1.30:8044 and sign in with the username and password above.
#  - Settings -> Auto-download newest sets the global default. It is a target, not a floor:
#    lowering it removes the excess on the next refresh, and 0 reclaims everything except
#    queued, starred, and hand-picked downloads. Per-show values override it; blank inherits.
#  - Settings -> Download directory ceiling is the backstop. Worth setting once you have
#    seen a week of real usage.
#  - Starred episodes are exempt from retention *and* from that ceiling, by design. They
#    are the one thing here that grows without bound.
#  - Migrate from PinePods with Settings -> Import OPML, then run both in parallel for a
#    week. PinePods keeps its downloads at /mnt/nas/pinepods, so there is no conflict.
#
# ---------------------------------------------------------------------------------------
# BACKUPS
# ---------------------------------------------------------------------------------------
#
# Nothing to install. The backup service carries its own script, and Docker creates
# /home/jworthington/docker/podarium/backups on first start if it is not already there.
#
# Which build am I running?
#     docker logs podarium-api 2>&1 | grep "starting, build"
# prints "Podarium 0.1.0 starting, build <commit>". Compare that commit against the repo to
# confirm a repull actually took effect. A restart appends another line, so the last one is
# the running build.
#
# Check it ran:     docker logs podarium-backup
#                   ls -lh /home/jworthington/docker/podarium/backups
# Force one now:    docker restart podarium-backup
#
# Restore into a scratch database and compare before touching the live one:
#
#     docker exec podarium-db psql -U podarium -d podarium -c "create database restore_test"
#     gunzip -c /home/jworthington/docker/podarium/backups/podarium-YYYYMMDD-HHMMSS.sql.gz \
#       | docker exec -i podarium-db psql -U podarium -d restore_test
#
# Restoring over the live database needs it empty first -- the dump recreates the tables,
# so loading it into a populated database conflicts on every one of them.
#
# BACKUP_KEEP controls how many nightly dumps are retained; the default is 14.

# ---------------------------------------------------------------------------------------
# NOTIFICATIONS
# ---------------------------------------------------------------------------------------
#
# Optional, and off until the server has a VAPID keypair. Generate one:
#
#     docker exec podarium-api python -m podarium.vapid
#
# It prints three KEY=value lines. Paste them into the environment variables panel and
# redeploy. The private key is base64 rather than a PEM on purpose: a PEM is multi-line and
# full of slashes, which is the shape that arrives truncated through a panel like this one.
#
# Then Settings -> Notifications -> Turn on, and "Send a test" to prove it end to end.
#
# On iOS this only works once Podarium has been added to the Home Screen, and only over
# HTTPS -- so through the Cloudflare hostname, not the LAN address.
#
# Browsers pin the public key when a device subscribes. Replacing the pair silently breaks
# every existing subscription, and each device has to turn notifications on again.
